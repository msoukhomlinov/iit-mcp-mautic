name: ci

# A post-release check, not a gate: it runs after a release is cut (the v* tag
# already exists; release-please.yml calls this workflow once it has created
# the release), by hand (Actions, ci, Run workflow), and on pull requests that
# touch .github/** (action bumps from Renovate). Release PRs get no checks,
# because release-please opens them with the default GITHUB_TOKEN, whose events
# do not trigger workflows. Other PRs and pushes are not checked here; run
# bin/check.sh and tests/functional/run.sh locally, or this workflow by hand.
on:
  pull_request:
    paths: ['.github/**']
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out, default the triggering ref
        type: string
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: bin/check.sh
        run: |
          docker run --rm -v "$PWD:/p" -w /p --entrypoint bash \
            ghcr.io/kopexa-grc/php-apache:8.4-dev bin/check.sh

  # A real Mautic 7 (composer create-project) with this plugin installed from
  # the checkout, MariaDB, PHP's built-in web server; tests/functional/run.sh
  # exercises the plugin over HTTP; setup.sh covers the setup command on a
  # fresh install (so it is its own job). inspector.sh stays manual (needs npx).
  # On every PHP version we support.
  functional:
    name: functional (PHP ${{ matrix.php }}, ${{ matrix.script }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        script: [run.sh, setup.sh]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mautic
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bundle
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, exif, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_mysql, sockets, sodium, xml, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
      - name: Mautic 7 with this plugin
        run: |
          name="$(jq -r .name bundle/composer.json)"; version="$(tr -d '[:space:]' < bundle/VERSION)"
          composer create-project --no-dev --no-interaction --no-progress --ignore-platform-req=ext-imap \
            "mautic/recommended-project:^7.2" mautic
          cd mautic
          composer config --no-plugins allow-plugins.php-http/discovery false
          composer config repositories.bundle "{\"type\": \"path\", \"url\": \"../bundle\", \"options\": {\"symlink\": false, \"versions\": {\"$name\": \"$version\"}}}"
          composer require --no-progress --update-no-dev --ignore-platform-req=ext-imap "$name:$version"
          composer show "$name" | head -3
      - name: tests/functional/${{ matrix.script }}
        env:
          MAUTIC_DIR: ${{ github.workspace }}/mautic
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: mautic
          DB_USER: root
          DB_PASSWORD: root
        run: bundle/tests/functional/${{ matrix.script }}
